<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scientific Calculator</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#8ed6ff;
    }

    .calculator{
      width:420px;
      background:#2196f3;
      padding:25px;
      border-radius:30px;
      box-shadow:0 10px 25px rgba(0,0,0,0.25);
    }

    .display{
      width:100%;
      height:80px;
      border:none;
      outline:none;
      border-radius:15px;
      background:black;
      margin-bottom:20px;
      text-align:right;
      padding:15px;
      font-size:35px;
      color:white;
    }

    .buttons{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:15px;
    }

    button{
      height:70px;
      border:none;
      border-radius:18px;
      background:#0d5cc9;
      color:white;
      font-size:28px;
      cursor:pointer;
      transition:0.2s;
      box-shadow:0 4px 8px rgba(0,0,0,0.2);
    }

    button:hover{
      background:#084ca7;
      transform:scale(1.05);
    }
      
     .number{
      background:#e8e8ee;
      color:#111;
    }

    .operator{
      background:#0047ab;
      color:white;
    }

    .equal{
      background:#002f6c;
      color:white;
      grid-column:span 2;
    }

    .clear{
      background:#d32f2f;
    }

  </style>
</head>

<body>

<div class="calculator">

  <input type="text" id="display" class="display" value="0" readonly>

  <div class="buttons">

      <button class="operator" onclick="clearDisplay()">C</button>
      <button class="operator" onclick="backspace()">⌫</button>
      <button class="operator" onclick="appendValue('%')">%</button>
      <button class="operator" onclick="appendValue('/')">/</button>

      <button class="number" onclick="appendValue('7')">7</button>
      <button class="number" onclick="appendValue('8')">8</button>
      <button class="number" onclick="appendValue('9')">9</button>
      <button class="operator" onclick="appendValue('*')">*</button>

      <button class="number" onclick="appendValue('4')">4</button>
      <button class="number" onclick="appendValue('5')">5</button>
      <button class="number" onclick="appendValue('6')">6</button>
      <button class="operator" onclick="appendValue('-')">-</button>

      <button class="number" onclick="appendValue('1')">1</button>
      <button class="number" onclick="appendValue('2')">2</button>
      <button class="number" onclick="appendValue('3')">3</button>

      <button class="operator" onclick="appendValue('+')">+</button>

      <button class="number" onclick="appendValue('0')">0</button>
      <button class="number" onclick="appendValue('.')">.</button>
      <button class="equal" onclick="calculate()">=</button>

  </div>

</div>

<script>

  let display = document.getElementById("display");

  function appendValue(value){

    if(display.value === "0"){
      display.value = value;
    }
    else{
      display.value += value;
    }
  }

  function clearDisplay() {
    display.value = "0";
  }

function backspace() {
  display.value = display.value.slice(0,-1);

      if(display.value === ""){
        display.value = "0";
      }
    }

    function calculate(){

      try{
        display.value = eval(display.value);
      }
      catch{
        display.value = "Error";
      }
    }

   </script>

</body>
</html>
